name: bundle

# Validate every target on every push and PR, then deploy `dev` on main.
# `test` and `prod` are intentionally NOT deployed automatically — see the
# commented job at the bottom and the note in DESIGN.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Secrets are optional here. Wiring live credentials to a Free Edition
  # workspace is a judgement call, and a repo without them should still show a
  # green build rather than a failure that means nothing. So this job decides
  # whether credentials exist and the rest of the workflow keys off its output.
  #
  # It has to be a job output: the `secrets` context is not available in a
  # job-level `if`, so "skip when unset" cannot be expressed directly.
  preflight:
    name: check credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -n "$DATABRICKS_HOST" ] && [ -n "$DATABRICKS_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Databricks credentials found — validating and deploying dev."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABRICKS_HOST / DATABRICKS_TOKEN are not set, so the \
            Databricks jobs are skipped. Set them as repository secrets to enable \
            them; see DESIGN.md for how this would be wired with OIDC and a service \
            principal in a real workspace."
          fi

  validate:
    name: validate all targets
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      # Validation is the cheap gate: it catches a malformed databricks.yml, a
      # bad variable reference or a notebook path typo before anything is
      # deployed, and it runs for all three targets so a change that only
      # breaks prod cannot pass on dev.
      - name: validate dev
        run: databricks bundle validate -t dev
      - name: validate test
        run: databricks bundle validate -t test
      - name: validate prod
        run: databricks bundle validate -t prod

  deploy-dev:
    name: deploy dev
    needs: [preflight, validate]
    if: needs.preflight.outputs.configured == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: deploy dev
        run: databricks bundle deploy -t dev

      # Deploying makes the migration available; running applies it. Keeping
      # them as two steps is the point — a deploy never changes data on its own.
      - name: run the medallion job
        run: databricks bundle run medallion_job -t dev

  # Promotion to test and prod is deliberately not wired to a push.
  #
  #   deploy-prod:
  #     needs: deploy-dev
  #     environment: prod        # GitHub environment with required reviewers
  #     steps:
  #       - run: databricks bundle deploy -t prod
  #       - run: databricks bundle run medallion_job -t prod
  #
  # With a real workspace this authenticates as a service principal via OIDC
  # (`databricks/setup-cli` + `id-token: write`) rather than a PAT, so there is
  # no long-lived credential in GitHub at all, and the principal — not a human —
  # is the only identity with write access to the prod schema.
