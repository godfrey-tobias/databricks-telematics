# Telematics — Databricks Asset Bundle
#
# One bundle, three targets (dev / test / prod) against a single Free Edition
# workspace. Every object the pipeline needs is declared here or applied by a
# bundle job: the Unity Catalog schema, the landing + checkpoint volumes, the
# tables (as versioned SQL migrations), and the jobs themselves. Nothing is
# created or altered by hand in the workspace UI.
#
# Free Edition constraints that shaped this file:
#   * serverless only  -> no job_clusters / new_cluster anywhere; tasks with no
#                         compute spec are scheduled on serverless automatically.
#   * limited egress   -> no external sources; data is generated in-workspace.

bundle:
  name: telematics

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds one schema per environment.
    default: telematics

  env_schema:
    description: Schema for this target. This is the environment boundary.
    default: dev

  env_label:
    description: Short target label used to name jobs.
    default: dev

  landing_volume:
    description: Managed volume used as the Auto Loader landing zone.
    default: landing

  checkpoints_volume:
    description: Managed volume holding streaming checkpoints and schema locations.
    default: checkpoints

  pings_batches:
    description: Number of micro-batches of synthetic pings the generator writes per run.
    default: 20

  pings_sleep_seconds:
    description: Pause between generated ping files, in seconds.
    default: 1

  pipeline_schedule_cron:
    description: Quartz cron expression for the medallion job.
    default: 0 0 6 * * ?

  pipeline_schedule_status:
    description: PAUSED or UNPAUSED — lets dev stay manual while test/prod run on a schedule.
    default: PAUSED

  geofence_name:
    description: Label written to the Gold geofence column.
    default: chicago_loop

  geofence_min_lat:
    default: 41.80
  geofence_max_lat:
    default: 41.95
  geofence_min_lon:
    default: -87.75
  geofence_max_lon:
    default: -87.55

targets:
  # ---------------------------------------------------------------------------
  # dev — manual runs, the most generated data, deployed under the developer's
  # own workspace home so it can never collide with test/prod.
  # ---------------------------------------------------------------------------
  dev:
    mode: development
    default: true
    presets:
      # `mode: development` would otherwise prefix every object with
      # "[dev <user>] ". We name objects by target explicitly instead, so the
      # names have the same shape in all three environments (and so Unity
      # Catalog object names stay clean).
      name_prefix: ""
    variables:
      env_schema: dev
      env_label: dev
      pings_batches: 20
      pipeline_schedule_cron: "0 0 6 * * ?"
      pipeline_schedule_status: PAUSED

  # ---------------------------------------------------------------------------
  # test — scheduled hourly, smaller data volume. Same code, different config.
  # ---------------------------------------------------------------------------
  test:
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      env_schema: test
      env_label: test
      pings_batches: 10
      pipeline_schedule_cron: "0 0 * * * ?"
      pipeline_schedule_status: UNPAUSED

  # ---------------------------------------------------------------------------
  # prod — deploy-only. `mode: production` blocks the development conveniences
  # (no name prefixing, no auto-pausing of schedules, concurrent-run guards) and
  # the bundle root lives outside any single user's home directory.
  # ---------------------------------------------------------------------------
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # Free Edition is single-identity. In a real workspace this is a service
      # principal, and humans get RUN/VIEW on the job but no CREATE on the schema.
      user_name: ${workspace.current_user.userName}
    variables:
      env_schema: prod
      env_label: prod
      pings_batches: 5
      pipeline_schedule_cron: "0 0/15 * * * ?"
      pipeline_schedule_status: UNPAUSED
